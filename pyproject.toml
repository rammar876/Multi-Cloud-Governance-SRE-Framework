[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-cloud-governance-sre"
version = "0.1.0"
description = "Reference implementation for normalized multi-cloud governance and drift detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved" }
authors = [{ name = "Ramesh Marella" }]

[project.scripts]
mcgsre = "mcgsre.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
